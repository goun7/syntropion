[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syntropion"
dynamic = ["version"]
description = "SYNTROPION OS — Autonomous AI Venture Studio & Micro-SaaS Factory Operating System"
requires-python = ">=3.11"

[tool.hatch.version]
path = "syntropion_core/__init__.py"

# G44 ( 2026-10-20): hatchling varsayilan-olarak hangi-paketin-dahil-edilecegini
# bulamiyordu ( wheel-basarisiz). Paket-yolu acikca-belirtildi.
[tool.hatch.build.targets.wheel]
packages = ["syntropion_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# AT-162: SECRET_KEY-ZORUNLU ( ≥16-karakter) — import-anında-RED.
# testler-kendisi-guard'ı-taşır ( AT-186); run_all-dışı-çalıştırmada-da-yeşil.
