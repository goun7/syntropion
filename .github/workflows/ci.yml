name: SYNTROPION OS CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-verify:
    name: Test & Coverage Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Execute Test Suite with Coverage Gate
        env:
          SHM_IPC_PATH: /dev/shm/syntropion_ci_ipc
          # G48-2026-10-22: SYNTROPION_DB_PATH-!:memory:-CI'da-AYRICA-hatali-
          # ( connection-basina-yeni-bellek-DB'si-acilir, schema-kaybolur ->
          # 29-failed + 34-error). tests/conftest.py-zaten-gecici-dosyaya-
          # izole-ediyor; bu-env'i-set-ETMEK-o-korumayi-eziyordu.
        run: |
          python -m pytest -v --cov=syntropion_core --cov-report=term-missing --cov-fail-under=98
